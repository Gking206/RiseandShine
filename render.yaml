services:
  - type: web
    name: rise-and-shine
    env: node
    region: frankfurt
    plan: free
    buildCommand: npm install && node -e "const fs=require('fs');['data/sessions','data/backups','logs','public/uploads'].forEach(d=>fs.mkdirSync(d,{recursive:true}));console.log('Dossiers créés.');"
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
