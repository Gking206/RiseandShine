<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — Rise And Shine</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-layout">
  <div class="auth-bg">
    <div class="auth-bg-orb"></div>
    <div class="auth-bg-orb"></div>
    <div class="auth-bg-orb"></div>
  </div>

  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-icon">✦</div>
      <div class="auth-title">Rise And Shine</div>
      <div class="auth-subtitle">Connectez-vous à votre espace</div>
    </div>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label class="form-label">Adresse Email <span class="required">*</span></label>
        <div class="input-group">
          <span class="input-icon">📧</span>
          <input type="email" name="email" class="form-input" placeholder="votre@email.com" required autocomplete="email">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Mot de Passe <span class="required">*</span></label>
        <div class="input-group">
          <span class="input-icon">🔒</span>
          <input type="password" name="password" id="passwordInput" class="form-input" placeholder="Votre mot de passe" required autocomplete="current-password">
        </div>
        <div style="text-align:right;margin-top:6px;">
          <button type="button" onclick="togglePassword()" style="background:none;border:none;font-size:0.75rem;color:var(--ras-gold);cursor:pointer;">Afficher</button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-full" style="margin-top: var(--space-2);">
        ✦ Se Connecter
      </button>
    </form>

    <div class="divider" style="margin: var(--space-5) 0;"></div>

    <p style="text-align:center;font-size:0.875rem;color:var(--text-muted);">
      Pas encore membre ?
      <a href="/register.html" style="color:var(--ras-gold);font-weight:600;">Rejoindre Rise And Shine</a>
    </p>

    <p style="text-align:center;margin-top:var(--space-3);">
      <a href="/" style="font-size:0.8rem;color:var(--text-muted);">← Retour à l'accueil</a>
    </p>

  </div>

  <div class="toast-container" id="toastContainer"></div>
  <script src="/js/app.js"></script>
  <script>
    function togglePassword() {
      const input = document.getElementById('passwordInput');
      input.type = input.type === 'password' ? 'text' : 'password';
    }
  </script>
</body>
</html>
